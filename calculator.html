<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modular Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f5f5;
            color: #111;
        }

        .app {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-weight: 600;
        }

        input,
        button {
            padding: 10px;
            font-size: 1rem;
            border-radius: 6px;
        }

        input {
            border: 1px solid #ccc;
        }

        button {
            cursor: pointer;
            border: none;
            background: #1f6feb;
            color: white;
        }

        #bmi-result {
            min-height: 40px;
            font-weight: 600;
        }

        #table-container {
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>BMI Tracker</h1>

        <form id="bmi-form">
            <label for="weight">Weight (kg)</label>
            <input id="weight" name="weight" type="number" min="0" step="0.1" placeholder="Weight (kg)" required />

            <label for="height">Height (m)</label>
            <input id="height" name="height" type="number" min="0" step="0.01" placeholder="Height (m)" required />

            <button type="submit">Calculate BMI</button>
        </form>

        <div id="bmi-result" aria-live="polite"></div>
        <div id="table-container"></div>
    </div>

    <script src="calculator.js"></script>
</body>
</html>
